<!doctype html>
<!--
    Lucky Spin – main page.

    A fully static site: Apache only serves files, there is no server-side
    code and no database. The wheel, the winner pick and the recent-spins
    list all run in the browser (assets/wheel.js).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lucky Spin · Random Picker Wheel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="site-header">
        <h1>🎡 Lucky Spin</h1>
        <p>Enter some names, hit spin, and let the wheel pick a winner.</p>
    </header>

    <main class="layout">
        <!-- The wheel -->
        <section class="card wheel-card">
            <div class="wheel-wrap">
                <canvas id="wheel" role="img" aria-label="Picker wheel"></canvas>
            </div>
            <button id="spin-btn" class="spin-btn" type="button">SPIN</button>
        </section>

        <div class="side">
            <!-- Names input -->
            <section class="card">
                <div class="card-head">
                    <h2><label for="names">Names</label></h2>
                    <span id="name-count" class="count"></span>
                </div>
                <textarea id="names" rows="9" spellcheck="false"
                          placeholder="One name per line">Alice
Bob
Charlie
Dana
Ethan
Fatima</textarea>
                <p class="hint">2–20 names, one per line, up to 30 characters each.</p>
                <p id="form-error" class="error" role="alert" hidden></p>
            </section>

            <!-- Recent spins (saved in this browser only) -->
            <section class="card">
                <div class="card-head">
                    <h2>Recent spins</h2>
                    <button id="clear-history" class="link-btn" type="button" hidden>Clear</button>
                </div>
                <ol id="history-list" class="history"></ol>
                <p id="history-empty" class="muted">No spins yet. Be the first!</p>
            </section>
        </div>
    </main>

    <!-- Filled in from instance.json, which the EC2 user data writes at boot. -->
    <footer class="site-footer">
        Served by <span id="served-by"><code>local</code></span>
    </footer>

    <!-- Winner popup -->
    <div id="winner-modal" class="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="winner-title">
            <p id="winner-title" class="modal-label">🎉 The winner is</p>
            <p id="winner-name" class="winner-name"></p>
            <button id="modal-close" class="btn" type="button">Close</button>
        </div>
    </div>

    <script src="assets/wheel.js"></script>
</body>
</html>
